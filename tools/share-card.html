<!doctype html>
<!-- The picture a shared link shows (1200 x 630). Open at that size and photograph it to site/pilot/assets/noguru-share-card.png.
     The words are the home page's own title and first line. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoGuru share card</title>
<style>
@font-face{font-family:Manrope;src:url(../site/pilot/fonts/Manrope.woff) format('woff');font-weight:200 800}
@font-face{font-family:Fraunces;src:url(../site/pilot/fonts/Fraunces.woff) format('woff');font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#f7f3ea;color:#263e3a;font-family:Manrope,Arial,sans-serif;display:grid;grid-template-columns:1fr 380px;align-items:center;padding:64px 72px;position:relative;overflow:hidden}
body:before{content:'';position:absolute;right:-180px;bottom:-220px;width:620px;height:620px;border-radius:50%;background:#d4a17c;opacity:.16;filter:blur(40px)}
.mark{font-size:44px;font-weight:650;letter-spacing:-.055em}
.mark i{font-style:normal;color:#d4a17c}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:76px;line-height:1.04;letter-spacing:-.025em;margin-top:44px}
h1 em{font-style:normal;color:#6f8a7c}
p{font-size:27px;line-height:1.4;color:#526a60;margin-top:30px;max-width:640px}
img{width:360px;height:360px;justify-self:end;position:relative}
</style>
</head>
<body>
<div>
  <div class="mark">NoGuru<i>.</i></div>
  <h1>An automated crypto <em>trading bot.</em></h1>
  <p>Buys in steps as prices fall, and sells above its average. In your own exchange account.</p>
</div>
<img src="../site/pilot/assets/noguru-guide-original.png" alt="">
</body>
</html>
