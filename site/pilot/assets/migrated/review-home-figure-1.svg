<svg aria-labelledby="hero-title hero-desc" class="price-diagram desktop-diagram" role="img" viewbox="0 0 600 375" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#263E3A;--ink-dim:#617D71;--line:#D9D4C9;--green:#617D71;--red:#A55B4D;--bg:#F7F3EA;--card:#F7F3EA;}text{font-family:Arial,sans-serif}</style><title id="hero-title">Planned buys, a possible target sale, and an alternative continued fall</title><desc id="hero-desc">Price is vertical and time moves right. Two buys occur at progressively lower prices. Their combined average cost lies between those prices. One illustrative path recovers to a sale above the average cost but below the first buy. An alternative falls further, leaving the position open. A separate possible next cycle has its own lower buys and higher target; it starts above the previous sale in this drawing. Neither recovery nor a next cycle is guaranteed.</desc>
