<svg aria-labelledby="scenario-chart-title scenario-chart-desc" class="scenario-chart" role="img" viewbox="0 0 680 360" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#263E3A;--ink-dim:#617D71;--line:#D9D4C9;--green:#617D71;--red:#A55B4D;--bg:#F7F3EA;--card:#F7F3EA;}text{font-family:Arial,sans-serif}</style><title id="scenario-chart-title">Illustrative price path after two buys</title><desc id="scenario-chart-desc">One buy at 100 and another at 80 give an average cost of 88.89 before fees. The target is 92. Time is schematic with no fixed duration.</desc><g fill="none" stroke="#ded8ce" stroke-width="1"><path d="M68 50V290H636"/><path d="M68 100H636M68 180H636M68 260H636" stroke-dasharray="3 6"/></g><g fill="#65655f" font-family="Arial,sans-serif" font-size="14"><text x="10" y="54">Price</text><text x="20" y="105">100</text><text x="28" y="185">80</text><text x="28" y="265">60</text><text x="477" y="332">Time → not to scale</text></g><path d="M68 132H636" stroke="#647f64" stroke-dasharray="6 5" stroke-width="1.5"/><text fill="#47634a" font-family="Arial,sans-serif" font-size="14" x="455" y="120">Target 92</text><path d="M68 144.4H636" stroke="#77716b" stroke-dasharray="3 4"/><text fill="#65655f" font-family="Arial,sans-serif" font-size="13" x="420" y="164">Average cost 88.89</text><path d="M85 70 L160 100 L235 136 L305 180 L390 160 L480 144 L585 132" fill="none" id="scenario-line" stroke="#e85b25" stroke-linejoin="round" stroke-width="4"/><circle cx="160" cy="100" fill="#e85b25" r="7"/><circle cx="305" cy="180" fill="#e85b25" r="7"/><circle cx="585" cy="132" fill="#397f5a" id="scenario-end" r="7"/><g fill="#292c29" font-family="Arial,sans-serif" font-size="14" font-weight="700"><text x="115" y="79">Buy at 100</text><text x="265" y="210">Buy at 80</text><text id="scenario-end-label" x="493" y="98">Sale at 92</text></g></svg>