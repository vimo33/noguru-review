<svg aria-labelledby="how-mobile-title how-mobile-desc" class="price-diagram mobile-diagram" role="img" viewbox="0 0 360 380" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#263E3A;--ink-dim:#617D71;--line:#D9D4C9;--green:#617D71;--red:#A55B4D;--bg:#F7F3EA;--card:#F7F3EA;}text{font-family:Arial,sans-serif}</style><title id="how-mobile-title">Buy in steps, aim to sell above the combined average</title><desc id="how-mobile-desc">Illustration only. Two buys at lower prices have a combined average between them. A possible recovery sells above that average. A continued fall leaves an open holding. A separate next cycle below has its own prices, lower buys and a higher sale target. Timing and recovery are uncertain.</desc><rect fill="#fffaf1" height="377" rx="16" stroke="#e4dac9" width="358" x="1" y="1"/><g stroke="#eee4d4"><path d="M37 66H329M37 124H329M37 182H329"/></g><path d="M37 211V42M37 211H329" fill="none" stroke="#b9b09d"/><text fill="#7b7567" font-size="11" x="18" y="30">Price</text><text fill="#7b7567" font-size="11" x="293" y="228">Time →</text><path d="M53 57 78 101 105 94 131 165 157 173 181 146 206 154 237 131 271 118" fill="none" stroke="#ed5b22" stroke-linejoin="round" stroke-width="3"/><path d="M80 139H280" stroke="#989c83" stroke-dasharray="4 4"/><text fill="#747965" font-size="10.5" x="158" y="134">Combined average</text><path d="M157 173 189 187 220 178 247 201" fill="none" stroke="#a8624d" stroke-dasharray="4 4" stroke-width="2"/><circle cx="78" cy="101" fill="#fffaf1" r="6" stroke="#e75218" stroke-width="2.5"/><circle cx="131" cy="165" fill="#fffaf1" r="6" stroke="#e75218" stroke-width="2.5"/><circle cx="271" cy="118" fill="#2d785a" r="7" stroke="#fffaf1" stroke-width="2"/><text fill="#b44519" font-size="12" font-weight="700" x="52" y="89">Buy 1</text><text fill="#b44519" font-size="12" font-weight="700" x="82" y="190">Buy 2</text><text fill="#246344" font-size="12" font-weight="700" x="246" y="99">Target sale</text><text fill="#985e48" font-size="10.5" x="42" y="229">Continued fall → holding stays open</text><path d="M20 247H340" stroke="#e4dac9"/><text fill="#776d5e" font-size="11" font-weight="600" x="23" y="269">A possible next cycle · its own prices</text><path d="M48 287 80 310 111 339 138 328 169 344 211 302 250 290 285 281" fill="none" stroke="#ed5b22" stroke-linejoin="round" stroke-width="3"/><circle cx="80" cy="310" fill="#fffaf1" r="5" stroke="#e75218" stroke-width="2.5"/><circle cx="111" cy="339" fill="#fffaf1" r="5" stroke="#e75218" stroke-width="2.5"/><circle cx="285" cy="281" fill="#2d785a" r="6"/><text fill="#b44519" font-size="11" x="46" y="361">New buys</text><text fill="#246344" font-size="11" x="250" y="306">New target</text><text fill="#817565" font-size="10" x="179" y="362">No guaranteed repeat.</text></svg>